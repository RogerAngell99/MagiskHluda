name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release info
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          REQUIRED_ARCHES = ("arm", "arm64", "x86", "x86_64")
          repo = os.environ["GITHUB_REPOSITORY"]

          def get_json(url: str, allow_404: bool = False):
              request = urllib.request.Request(url, headers={"User-Agent": "github-actions"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise

          releases = get_json("https://api.github.com/repos/Ylarod/Florida/releases?per_page=20")
          florida_tag = ""
          for release in releases:
              if release.get("draft") or release.get("prerelease"):
                  continue

              tag = release.get("tag_name")
              assets = {
                  asset.get("name"): asset.get("browser_download_url")
                  for asset in release.get("assets", [])
              }
              expected_assets = [
                  f"florida-server-{tag}-android-{arch}.gz" for arch in REQUIRED_ARCHES
              ]
              if tag and all(asset_name in assets for asset_name in expected_assets):
                  florida_tag = tag
                  break

          if not florida_tag:
              print("No Florida release with all required server assets was found.", file=sys.stderr)
              sys.exit(1)

          module_release = get_json(
              f"https://api.github.com/repos/{repo}/releases/latest",
              allow_404=True,
          )
          module_tag = module_release.get("tag_name", "") if module_release else ""

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"LATESTFLORIDARELEASETAG={florida_tag}\n")
              env_file.write(f"LATESTMODULETAG={module_tag}\n")

          print(f"Resolved Florida tag: {florida_tag}")
          print(f"Current module tag: {module_tag or '(none)'}")
          PY
      - name: Check if release needed
        id: check_release
        run: |
          if [ -n "${{ env.LATESTFLORIDARELEASETAG }}" ] && \
             [ "${{ env.LATESTFLORIDARELEASETAG }}" != "${{ env.LATESTMODULETAG }}" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
      - name: Cache vcpkg packages
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - name: Setup vcpkg if not cached
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          if [ ! -x "vcpkg/vcpkg" ]; then
            git clone https://github.com/Microsoft/vcpkg.git
            cd vcpkg
            ./bootstrap-vcpkg.sh
            ./vcpkg install rapidjson restclient-cpp
            cd ..
          fi
      - name: Build MagiskHluda
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release
          cp build/MagiskHluda .
      - name: Download all Florida servers from ylarod's repo
        if: steps.check_release.outputs.should_release == 'true'
        env:
          MAGISKHLUDA_FLORIDA_TAG: ${{ env.LATESTFLORIDARELEASETAG }}
          MAGISKHLUDA_REPOSITORY: ${{ github.repository }}
        run: ./MagiskHluda

      - name: Set up Node.js
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle webpage with Vite
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          # Check if webroot directory exists
          if [ ! -d "webroot" ]; then
            echo "Error: webroot directory not found in the repository"
            exit 1
          fi
          
          # Create webroot directory in module_template if it doesn't exist
          mkdir -p module_template/webroot
          
          # Run Vite build directly with npx
          cd webroot
          npm install
          npx vite build

      - name: Prepare release archives
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          for arch in arm arm64 x86 x86_64; do
            FILENAME="florida-$([[ "$arch" == "x86_64" ]] && echo "x64" || echo "$arch").gz"
            mkdir -p "arch_release_$arch/bin"
            cp -r module_template/* "arch_release_$arch/"
            cp "bin/$FILENAME" "arch_release_$arch/bin/"
            (cd "arch_release_$arch" && zip -r "../Magisk-Florida-$arch-$LATESTFLORIDARELEASETAG.zip" .)
          done
          
          # Universal package
          mkdir -p universal_release
          cp -r module_template/* universal_release/
          mkdir -p "universal_release/bin"
          cp -r bin/* universal_release/bin/
          (cd universal_release && zip -r "../Magisk-Florida-Universal-$LATESTFLORIDARELEASETAG.zip" .)
      - name: Release Packages
        if: steps.check_release.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1.13.0
        with:
          artifacts: |
            ./*.zip
            update.json
          name: "Magisk Module for Florida Server ${{ env.LATESTFLORIDARELEASETAG }}"
          tag: "${{ env.LATESTFLORIDARELEASETAG }}"
          body: "Universal package and architecture-specific packages for Florida Server ${{env.LATESTFLORIDARELEASETAG}}"
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
