name: CI
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target version
        id: resolve_version
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          github_output = os.environ["GITHUB_OUTPUT"]

          def get_json(url: str, allow_404: bool = False):
              request = urllib.request.Request(url, headers={"User-Agent": "github-actions"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return None
                  raise

          frida_release = get_json("https://api.github.com/repos/frida/frida/releases/latest")
          frida_tag = frida_release.get("tag_name", "")
          if not frida_tag:
              print("Unable to resolve the latest Frida release tag.", file=sys.stderr)
              sys.exit(1)

          module_release = get_json(
              f"https://api.github.com/repos/{repo}/releases/latest",
              allow_404=True,
          )
          module_tag = module_release.get("tag_name", "") if module_release else ""
          patch_ref = frida_tag
          patch_tag = get_json(
              f"https://api.github.com/repos/Ylarod/Florida/git/ref/tags/{frida_tag}",
              allow_404=True,
          )
          if patch_tag is None:
              patch_ref = "main"
              print(f"Florida tag {frida_tag} not found. Falling back to Florida/main patches.")

          should_release = frida_tag != module_tag

          with open(github_output, "a", encoding="utf-8") as output_file:
              output_file.write(f"release_tag={frida_tag}\n")
              output_file.write(f"module_tag={module_tag}\n")
              output_file.write(f"patch_ref={patch_ref}\n")
              output_file.write(f"should_release={'true' if should_release else 'false'}\n")

          print(f"Resolved Frida tag: {frida_tag}")
          print(f"Current module tag: {module_tag or '(none)'}")
          print(f"Using Florida patches from: {patch_ref}")
          PY
      - name: Build MagiskHluda
        if: steps.resolve_version.outputs.should_release == 'true'
        run: |
          cmake -B build -S .
          cmake --build build --config Release
      - name: Set up Node.js
        if: steps.resolve_version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Set up JDK 17
        if: steps.resolve_version.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android NDK
        if: steps.resolve_version.outputs.should_release == 'true'
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false
          link-to-sdk: true
      - name: Set up Python 3.9
        if: steps.resolve_version.outputs.should_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install build dependencies
        if: steps.resolve_version.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install \
            build-essential \
            tree \
            ninja-build \
            gcc-multilib \
            g++-multilib \
            lib32stdc++-9-dev \
            flex \
            bison \
            ruby \
            ruby-dev \
            python3-requests \
            python3-setuptools \
            python3-dev \
            python3-pip \
            libc6-dev \
            libc6-dev-i386 \
            -y
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief graphlib
      - name: Build latest Frida with Florida patches
        if: steps.resolve_version.outputs.should_release == 'true'
        env:
          MAGISKHLUDA_RELEASE_TAG: ${{ steps.resolve_version.outputs.release_tag }}
          MAGISKHLUDA_PATCH_REF: ${{ steps.resolve_version.outputs.patch_ref }}
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          rm -rf florida-patches frida build-android-arm build-android-arm64 build-android-x86 build-android-x86_64 bin
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch "$MAGISKHLUDA_PATCH_REF" https://github.com/Ylarod/Florida.git florida-patches
          git clone --recurse-submodules https://github.com/frida/frida.git frida
          git -C frida checkout "$MAGISKHLUDA_RELEASE_TAG"
          git -C frida submodule update --init --recursive

          cd frida
          shopt -s nullglob
          for path in ../florida-patches/patches/*; do
            name=$(basename "$path")
            if [ ! -d "subprojects/$name" ]; then
              echo "Missing Frida subproject for patch set: $name"
              exit 1
            fi
            if ! compgen -G "../florida-patches/patches/$name/*.patch" > /dev/null; then
              echo "No patch files found in $path"
              exit 1
            fi

            pushd "subprojects/$name" > /dev/null
            for patch_file in ../../../florida-patches/patches/"$name"/*.patch; do
              patch_name=$(basename "$patch_file")
              echo "Applying $name/$patch_name"
              if [ "$name" = "frida-core" ] && [ "$patch_name" = "0009-Florida-memfd-name-jit-cache.patch" ]; then
                python3 -c "from pathlib import Path; target = Path('lib/base/linux.vala'); original = 'return Linux.syscall (LinuxSyscall.MEMFD_CREATE, name, flags);'; patched = 'return Linux.syscall (LinuxSyscall.MEMFD_CREATE, \\\"jit-cache\\\", flags);'; text = target.read_text(encoding='utf-8'); import sys; sys.exit('memfd-name-jit-cache workaround is already present unexpectedly') if patched in text else None; sys.exit('Unable to locate memfd_create call for Florida workaround') if original not in text else None; target.write_text(text.replace(original, patched, 1), encoding='utf-8')"
                git add lib/base/linux.vala
                git commit -m "Apply Florida memfd-name-jit-cache workaround"
              else
                git am -3 "$patch_file"
              fi
            done
            popd > /dev/null
          done
          cd ..

          for arch in android-arm android-arm64 android-x86 android-x86_64; do
            mkdir "build-$arch"
            pushd "build-$arch"
            ../frida/configure --host="$arch"
            make -j"$(nproc)"
            popd
          done

          mkdir -p bin
          gzip -c build-android-arm/subprojects/frida-core/server/frida-server > bin/florida-arm.gz
          gzip -c build-android-arm64/subprojects/frida-core/server/frida-server > bin/florida-arm64.gz
          gzip -c build-android-x86/subprojects/frida-core/server/frida-server > bin/florida-x86.gz
          gzip -c build-android-x86_64/subprojects/frida-core/server/frida-server > bin/florida-x64.gz
      - name: Generate module metadata
        if: steps.resolve_version.outputs.should_release == 'true'
        env:
          MAGISKHLUDA_RELEASE_TAG: ${{ steps.resolve_version.outputs.release_tag }}
          MAGISKHLUDA_REPOSITORY: ${{ github.repository }}
        run: ./build/MagiskHluda
      - name: Bundle webpage with Vite
        if: steps.resolve_version.outputs.should_release == 'true'
        run: |
          if [ ! -d "webroot" ]; then
            echo "Error: webroot directory not found in the repository"
            exit 1
          fi
          mkdir -p module_template/webroot
          cd webroot
          npm install
          npx vite build
      - name: Prepare release archives
        if: steps.resolve_version.outputs.should_release == 'true'
        run: |
          for arch in arm arm64 x86 x86_64; do
            FILENAME="florida-$([[ "$arch" == "x86_64" ]] && echo "x64" || echo "$arch").gz"
            mkdir -p "arch_release_$arch/bin"
            cp -r module_template/* "arch_release_$arch/"
            cp "bin/$FILENAME" "arch_release_$arch/bin/"
            (cd "arch_release_$arch" && zip -r "../Magisk-Florida-$arch-${{ steps.resolve_version.outputs.release_tag }}.zip" .)
          done
          mkdir -p universal_release
          cp -r module_template/* universal_release/
          mkdir -p universal_release/bin
          cp -r bin/* universal_release/bin/
          (cd universal_release && zip -r "../Magisk-Florida-Universal-${{ steps.resolve_version.outputs.release_tag }}.zip" .)
      - name: Publish release
        if: steps.resolve_version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGISKHLUDA_RELEASE_TAG: ${{ steps.resolve_version.outputs.release_tag }}
        run: |
          gh release create "$MAGISKHLUDA_RELEASE_TAG" \
            ./*.zip \
            update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Magisk Module for Florida Server $MAGISKHLUDA_RELEASE_TAG" \
            --notes "Universal package and architecture-specific packages for Florida Server $MAGISKHLUDA_RELEASE_TAG"
